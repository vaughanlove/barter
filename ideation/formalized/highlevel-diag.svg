<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 310" role="graphics-document document" aria-roledescription="flowchart" style="background:#ffffff;font-family:'trebuchet ms',verdana,arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
  </defs>

  <!-- edges -->
  <path d="M 270 62 C 305 62, 300 128, 328 138" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 560 146 L 738 146" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 445 214 L 445 184" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 562 250 C 650 250, 760 215, 838 184" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- edge labels -->
  <g font-size="13px" fill="#333333" text-anchor="middle">
    <rect x="272" y="76" width="66" height="20" fill="#ffffff"/>
    <text x="305" y="91">Protocol</text>
    <rect x="591" y="124" width="118" height="20" fill="#ffffff"/>
    <text x="650" y="139">Barter with proof</text>
    <rect x="453" y="188" width="104" height="20" fill="#ffffff"/>
    <text x="505" y="203">Generate proof</text>
    <rect x="668" y="222" width="84" height="20" fill="#ffffff"/>
    <text x="710" y="237">Verify proof</text>
  </g>

  <!-- nodes -->
  <g text-anchor="middle">
    <rect x="30" y="26" width="240" height="72" fill="#ffffff" stroke="#3b3b4f" stroke-width="2"/>
    <text x="150" y="58" font-size="16px" fill="#333333">barter.computer</text>
    <text x="150" y="80" font-size="12px" fill="#808080">/protocol</text>

    <rect x="330" y="110" width="230" height="72" fill="#ffffff" stroke="#3b3b4f" stroke-width="2"/>
    <text x="445" y="142" font-size="16px" fill="#333333">Muse</text>
    <text x="445" y="164" font-size="12px" fill="#808080">/personal-agent</text>

    <rect x="740" y="110" width="230" height="72" fill="#ffffff" stroke="#3b3b4f" stroke-width="2"/>
    <text x="855" y="142" font-size="16px" fill="#333333">Vendor Agents × N</text>
    <text x="855" y="164" font-size="12px" fill="#808080">/vendor</text>

    <rect x="330" y="216" width="230" height="72" fill="#ffffff" stroke="#3b3b4f" stroke-width="2"/>
    <text x="445" y="248" font-size="16px" fill="#333333">prove.barter.computer</text>
    <text x="445" y="270" font-size="12px" fill="#808080">/tsln-sidecar</text>
  </g>
</svg>
